<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>史鑫炜 · 个人简历 | AI 内容策划 / 视觉创作</title>
<meta name="description" content="史鑫炜的个人简历：AI 内容策划、视觉创作、新媒体运营、提示词工程。">
<script>
(function(){
  try{
    var t = localStorage.getItem('resume-theme');
    if(!t){
      t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', t);
  }catch(e){}
})();
</script>
<style>
/* ===================== 设计令牌 ===================== */
:root{
  --bg:#f5f7fc;
  --surface:#ffffff;
  --surface-2:#eef1f9;
  --text:#0e1729;
  --muted:#63708b;
  --border:#e3e8f4;
  --border-strong:#cfd7ea;
  --brand:#4f46e5;
  --brand-2:#7c3aed;
  --accent:#06b6d4;
  --nav-bg:rgba(255,255,255,.78);
  --shadow:0 1px 2px rgba(15,23,42,.04), 0 10px 28px rgba(15,23,42,.06);
  --shadow-hover:0 6px 16px rgba(79,70,229,.12), 0 22px 44px rgba(15,23,42,.10);
  --ring:rgba(79,70,229,.32);
  --ph-bg:rgba(79,70,229,.09);
  --ph-fg:#5b5fc7;
  --btn-grad:linear-gradient(135deg,#4f46e5,#7c3aed);
  --grad-text:linear-gradient(115deg,#4f46e5 0%,#7c3aed 48%,#06b6d4 100%);
  --glow-1:rgba(79,70,229,.15);
  --glow-2:rgba(6,182,212,.13);
  --radius:16px;
  --nav-h:64px;
  --maxw:1080px;
}
[data-theme="dark"]{
  --bg:#080d19;
  --surface:#111a2c;
  --surface-2:#18233a;
  --text:#e9edf8;
  --muted:#93a1bd;
  --border:#1f2b45;
  --border-strong:#2f3d5c;
  --brand:#9aa4ff;
  --brand-2:#c4b5fd;
  --accent:#22d3ee;
  --nav-bg:rgba(8,13,25,.78);
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 12px 30px rgba(0,0,0,.35);
  --shadow-hover:0 8px 22px rgba(0,0,0,.55), 0 26px 54px rgba(0,0,0,.45);
  --ring:rgba(154,164,255,.35);
  --ph-bg:rgba(154,164,255,.14);
  --ph-fg:#b3bbff;
  --btn-grad:linear-gradient(135deg,#5b52f0,#7c3aed);
  --grad-text:linear-gradient(115deg,#9aa4ff 0%,#c4b5fd 48%,#67e8f9 100%);
  --glow-1:rgba(99,102,241,.22);
  --glow-2:rgba(34,211,238,.13);
}

/* ===================== 基础 ===================== */
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC","Helvetica Neue",Arial,sans-serif;
  font-size:15px;
  line-height:1.7;
  color:var(--text);
  background-color:var(--bg);
  background-image:
    radial-gradient(1000px 560px at 8% -12%, var(--glow-1), transparent 62%),
    radial-gradient(820px 520px at 96% 2%, var(--glow-2), transparent 60%);
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  transition:background-color .3s ease, color .3s ease;
  overflow-x:hidden;
}
::selection{background:var(--ring);color:var(--text)}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
h1,h2,h3,p,ul,figure{margin:0}
ul{padding:0;list-style:none}
img{max-width:100%}

.wrap{width:100%;max-width:var(--maxw);margin:0 auto;padding:0 22px}
.skip{position:absolute;left:-9999px;top:0}
.skip:focus{left:12px;top:12px;z-index:999;background:var(--surface);padding:8px 14px;border-radius:10px;border:1px solid var(--border)}

/* ===================== 导航 ===================== */
.nav{
  position:fixed;inset:0 0 auto 0;height:var(--nav-h);z-index:120;
  background:var(--nav-bg);
  -webkit-backdrop-filter:saturate(180%) blur(16px);
  backdrop-filter:saturate(180%) blur(16px);
  border-bottom:1px solid var(--border);
}
.nav-inner{
  max-width:var(--maxw);margin:0 auto;height:100%;padding:0 22px;
  display:flex;align-items:center;gap:16px;
}
.brand{display:flex;align-items:center;gap:10px;flex:none}
.brand-dot{
  width:28px;height:28px;border-radius:9px;flex:none;overflow:hidden;
  background:var(--btn-grad);
  box-shadow:0 6px 14px var(--ring);
  display:grid;place-items:center;color:#fff;font-size:13px;font-weight:800;
}
.brand-dot img{width:100%;height:100%;object-fit:cover;display:block}
.brand-text{display:flex;flex-direction:column;line-height:1.15}
.brand-name{font-size:14.5px;font-weight:700;letter-spacing:.01em}
.brand-sub{font-size:10px;letter-spacing:.16em;color:var(--muted);font-weight:600}

.nav-links{flex:1;display:flex;justify-content:center;align-items:center;gap:2px;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none}
.nav-links::-webkit-scrollbar{display:none}
.nav-links a{
  font-size:13.5px;color:var(--muted);padding:7px 11px;border-radius:9px;
  white-space:nowrap;transition:color .18s ease,background-color .18s ease;
}
.nav-links a:hover{color:var(--brand);background:var(--surface-2)}

.nav-actions{display:flex;align-items:center;gap:8px;flex:none}
.icon-btn{
  width:36px;height:36px;border-radius:11px;border:1px solid var(--border);
  background:var(--surface);color:var(--muted);display:grid;place-items:center;
  cursor:pointer;transition:transform .18s ease,color .18s ease,border-color .18s ease;
}
.icon-btn:hover{color:var(--brand);border-color:var(--border-strong);transform:translateY(-1px)}
.icon-btn svg{width:17px;height:17px;display:block}
.print-btn{
  display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 15px;border-radius:11px;
  border:1px solid transparent;cursor:pointer;font-size:13px;font-weight:600;color:#fff;
  background:var(--btn-grad);box-shadow:0 8px 18px var(--ring);
  transition:transform .18s ease,box-shadow .18s ease;
}
.print-btn:hover{transform:translateY(-1px);box-shadow:0 12px 24px var(--ring)}
.print-btn svg{width:15px;height:15px}

/* ===================== Hero ===================== */
.hero{padding:calc(var(--nav-h) + 62px) 0 16px}
.hero-grid{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:44px;align-items:center}
.hero-side{display:flex;justify-content:flex-end}
.eyebrow{
  display:inline-flex;align-items:center;gap:8px;font-size:11.5px;font-weight:700;
  letter-spacing:.18em;color:var(--brand);margin-bottom:14px;
}
.eyebrow::before{content:"";width:22px;height:1.5px;background:var(--btn-grad);border-radius:2px}
.hero-name{
  font-size:clamp(34px,6vw,52px);line-height:1.1;letter-spacing:-.02em;font-weight:800;
}
.hero-name em{
  font-style:normal;
  background:var(--grad-text);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:transparent;
}
.hero-role{margin-top:12px;font-size:clamp(14px,2.2vw,16.5px);font-weight:600;letter-spacing:.01em}
.hero-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.hero-meta span{
  font-size:12.5px;color:var(--muted);padding:3px 10px;border-radius:7px;
  background:var(--surface-2);border:1px solid var(--border);
}
.hero-summary{margin-top:20px;max-width:62ch;font-size:14.5px;color:var(--muted)}
.hero-badges{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.badge{
  font-size:12.5px;padding:6px 13px;border-radius:999px;
  background:var(--surface);border:1px solid var(--border);color:var(--muted);
  transition:transform .18s ease,color .18s ease,border-color .18s ease;
}
.badge:hover{color:var(--brand);border-color:var(--brand);transform:translateY(-1px)}
.badge.hot{color:var(--brand);border-color:var(--ring);background:var(--ph-bg);font-weight:600}
.hero-cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}

.btn{
  display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 18px;border-radius:12px;
  font-size:13.5px;font-weight:600;cursor:pointer;border:1px solid transparent;
  transition:transform .18s ease,box-shadow .18s ease,background-color .18s ease,color .18s ease,border-color .18s ease;
  white-space:nowrap;
}
.btn svg{width:15px;height:15px;flex:none}
.btn-primary{color:#fff;background:var(--btn-grad);box-shadow:0 10px 22px var(--ring)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 16px 30px var(--ring)}
.btn-ghost{color:var(--text);background:var(--surface);border-color:var(--border)}
.btn-ghost:hover{transform:translateY(-2px);border-color:var(--border-strong);color:var(--brand);box-shadow:var(--shadow)}
.btn.copied{color:#0d9488;border-color:#0d9488}

/* 头像 */
.avatar{
  position:relative;width:180px;height:180px;flex:none;
  display:grid;place-items:center;
}
.avatar-ring{position:absolute;inset:0;width:100%;height:100%;animation:spin 44s linear infinite}
.avatar-core,.avatar-img{grid-area:1 / 1}
.avatar-core{
  width:120px;height:120px;border-radius:50%;display:grid;place-items:center;
  font-size:42px;font-weight:800;color:#fff;letter-spacing:2px;
  background:linear-gradient(135deg,#4f46e5,#7c3aed 58%,#06b6d4);
  box-shadow:0 18px 40px rgba(79,70,229,.34);
}
.avatar-img{
  width:120px;height:120px;border-radius:50%;object-fit:cover;object-position:center;
  box-shadow:0 18px 40px rgba(79,70,229,.34), 0 0 0 5px var(--surface), 0 0 0 7px var(--border);
  background:var(--surface-2);
}
.avatar [hidden]{display:none!important}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===================== 区块 ===================== */
.section{padding:54px 0;scroll-margin-top:calc(var(--nav-h) + 10px)}
.sec-head{display:flex;align-items:center;gap:14px;margin-bottom:26px}
.sec-num{
  font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--brand);
  padding:4px 9px;border-radius:8px;background:var(--ph-bg);
}
.sec-head h2{font-size:20px;font-weight:700;letter-spacing:-.01em}
.sec-line{flex:1;height:1px;background:linear-gradient(90deg,var(--border),transparent)}
.sec-hint{font-size:12px;color:var(--muted)}

/* 占位标记 */
.ph{
  display:inline-block;font-size:.85em;padding:1px 7px;margin:0 1px;
  border-radius:999px;background:var(--ph-bg);color:var(--ph-fg);
  border:1px dashed var(--ring);font-weight:600;letter-spacing:.02em;line-height:1.5;
}

/* 卡片 */
.card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow);
  transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease;
}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-hover);border-color:var(--border-strong)}

/* ===================== 亮点 ===================== */
.hl-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(196px,1fr));gap:14px}
.hl{
  position:relative;padding:20px 18px;border-radius:var(--radius);
  background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow);
  overflow:hidden;transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease;
}
.hl::after{
  content:"";position:absolute;top:0;left:0;width:100%;height:2px;
  background:linear-gradient(90deg,var(--brand),var(--accent));
  opacity:0;transition:opacity .2s ease;
}
.hl:hover{transform:translateY(-4px);box-shadow:var(--shadow-hover);border-color:var(--border-strong)}
.hl:hover::after{opacity:1}
.hl-idx{font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--muted)}
.hl-val{margin-top:10px;font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.25}
.hl-label{margin-top:5px;font-size:13px;font-weight:700;color:var(--brand)}
.hl-desc{margin-top:8px;font-size:12.5px;line-height:1.62;color:var(--muted)}

/* ===================== Tabs ===================== */
.tabs{
  display:inline-flex;gap:4px;padding:5px;border-radius:999px;
  background:var(--surface-2);border:1px solid var(--border);
  margin-bottom:22px;max-width:100%;overflow-x:auto;scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  appearance:none;border:0;background:transparent;cursor:pointer;
  font-size:13.5px;font-weight:600;color:var(--muted);
  padding:8px 18px;border-radius:999px;white-space:nowrap;
  transition:color .18s ease,background-color .18s ease,box-shadow .18s ease;
}
.tab:hover{color:var(--brand)}
.tab[aria-selected="true"]{color:var(--brand);background:var(--surface);box-shadow:0 2px 10px rgba(15,23,42,.10)}
[data-theme="dark"] .tab[aria-selected="true"]{box-shadow:0 2px 10px rgba(0,0,0,.5)}
.tab:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.tabpanel.fade-in{animation:fadeUp .32s cubic-bezier(.22,1,.36,1) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ===================== 经历 ===================== */
.xp-list{display:grid;gap:16px}
.xp-card{padding:22px}
.xp-top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap}
.xp-role{font-size:16px;font-weight:700;letter-spacing:-.01em}
.xp-org{font-size:13.5px;font-weight:600;color:var(--brand);margin-top:3px}
.xp-time{
  font-size:12px;color:var(--muted);white-space:nowrap;
  padding:4px 10px;border-radius:8px;background:var(--surface-2);
}
.points{margin-top:16px}
.points li{
  position:relative;padding-left:20px;margin-bottom:9px;
  font-size:14px;line-height:1.72;
}
.points li:last-child{margin-bottom:0}
.points li::before{
  content:"";position:absolute;left:2px;top:.66em;width:7px;height:7px;border-radius:50%;
  background:linear-gradient(135deg,var(--brand),var(--accent));
  box-shadow:0 0 0 3px var(--ph-bg);
}
.tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
.tag{
  font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:7px;
  background:var(--surface-2);color:var(--muted);
}

/* ===================== 项目 ===================== */
.proj-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.proj-card{padding:22px;display:flex;flex-direction:column}
.proj-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.proj-name{font-size:16px;font-weight:700;letter-spacing:-.01em;line-height:1.4}
.proj-time{font-size:12px;color:var(--muted);white-space:nowrap;padding-top:3px}
.proj-type{font-size:12.5px;color:var(--brand);font-weight:700;margin-top:5px}

/* ===================== 作品集 ===================== */
.gallery-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.gallery-item{
  position:relative;overflow:hidden;cursor:zoom-in;
  border-radius:var(--radius);border:1px solid var(--border);
  background:var(--surface);box-shadow:var(--shadow);
  transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease;
}
.gallery-item:hover{transform:translateY(-4px);box-shadow:var(--shadow-hover);border-color:var(--border-strong)}
.gallery-item:focus-visible{outline:2px solid var(--brand);outline-offset:3px}
.gallery-item img{
  display:block;width:100%;aspect-ratio:4/3;object-fit:cover;
  background:var(--surface-2);
  transition:transform .45s cubic-bezier(.22,1,.36,1);
}
.gallery-item:hover img{transform:scale(1.04)}
.gallery-cap{
  position:absolute;left:0;right:0;bottom:0;
  padding:34px 16px 14px;color:#fff;
  background:linear-gradient(to top,rgba(6,10,22,.82) 12%,rgba(6,10,22,.34) 58%,transparent);
  display:flex;flex-direction:column;gap:2px;
  pointer-events:none;
}
.gallery-name{font-size:14px;font-weight:700;letter-spacing:.01em}
.gallery-desc{font-size:12px;opacity:.82}
.gallery-zoom{
  position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:11px;
  display:grid;place-items:center;color:#fff;
  background:rgba(6,10,22,.52);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.18);
  opacity:0;transform:translateY(-6px);
  transition:opacity .2s ease,transform .2s ease;
}
.gallery-item:hover .gallery-zoom{opacity:1;transform:none}
.gallery-zoom svg{width:16px;height:16px}

/* 灯箱 */
.lightbox{
  position:fixed;inset:0;z-index:300;padding:32px;
  display:grid;place-items:center;
  background:rgba(4,7,15,.88);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  opacity:0;pointer-events:none;
  transition:opacity .22s ease;
}
.lightbox.show{opacity:1;pointer-events:auto}
.lightbox img{
  max-width:min(94vw,1120px);max-height:84vh;
  border-radius:16px;object-fit:contain;
  box-shadow:0 34px 80px rgba(0,0,0,.6);
  transform:scale(.96);
  transition:transform .26s cubic-bezier(.22,1,.36,1);
}
.lightbox.show img{transform:scale(1)}
.lightbox-close{
  position:absolute;top:22px;right:22px;width:42px;height:42px;border-radius:13px;
  display:grid;place-items:center;cursor:pointer;color:#fff;
  background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.20);
  transition:background-color .18s ease,transform .18s ease;
}
.lightbox-close:hover{background:rgba(255,255,255,.20);transform:scale(1.05)}
.lightbox-close svg{width:18px;height:18px}

/* ===================== 技能 ===================== */
.skill-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.skill-card{padding:22px}
.skill-group{
  font-size:12px;font-weight:800;letter-spacing:.14em;color:var(--brand);
  text-transform:uppercase;margin-bottom:18px;
}
.skill-list{display:grid;gap:16px}
.skill-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:7px}
.skill-name{font-size:13.5px;font-weight:600}
.skill-lv{font-size:11.5px;color:var(--muted);font-weight:700}
.bar{height:6px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar > i{
  display:block;height:100%;width:0;border-radius:999px;
  background:linear-gradient(90deg,var(--brand),var(--accent));
  transition:width 1s cubic-bezier(.22,1,.36,1);
}
.skill-note{margin-top:6px;font-size:11.5px;color:var(--muted)}

/* ===================== 教育 / 证书 ===================== */
.edu-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.edu-card{padding:22px}
.edu-school{font-size:16px;font-weight:700;letter-spacing:-.01em}
.edu-major{font-size:13.5px;color:var(--brand);font-weight:600;margin-top:4px}
.edu-rows{margin-top:18px;display:grid;gap:11px}
.edu-row{display:flex;gap:14px;font-size:13.5px;line-height:1.7}
.edu-row .k{flex:none;width:88px;color:var(--muted)}
.edu-row .v{flex:1;min-width:0}

.award{display:flex;gap:14px;align-items:flex-start;padding:15px 0;border-bottom:1px dashed var(--border)}
.award:first-of-type{padding-top:0}
.award:last-child{border-bottom:0;padding-bottom:0}
.award-badge{
  width:38px;height:38px;border-radius:12px;flex:none;display:grid;place-items:center;
  background:var(--btn-grad);color:#fff;box-shadow:0 8px 18px var(--ring);
}
.award-badge svg{width:18px;height:18px}
.award-name{font-size:14px;font-weight:700;line-height:1.5}
.award-org{font-size:12.5px;color:var(--muted);margin-top:3px}

/* ===================== 页脚 ===================== */
.footer{margin-top:40px;padding:34px 0 46px;border-top:1px solid var(--border)}
.footer-inner{
  display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center;
  font-size:12.5px;color:var(--muted);
}

/* ===================== 浮动组件 ===================== */
.totop{
  position:fixed;right:20px;bottom:22px;width:44px;height:44px;border-radius:14px;
  border:1px solid var(--border);background:var(--surface);color:var(--text);
  display:grid;place-items:center;cursor:pointer;box-shadow:var(--shadow);
  opacity:0;transform:translateY(12px) scale(.96);pointer-events:none;
  transition:opacity .24s ease,transform .24s cubic-bezier(.22,1,.36,1),color .18s ease,border-color .18s ease;
  z-index:110;
}
.totop.show{opacity:1;transform:none;pointer-events:auto}
.totop:hover{color:var(--brand);border-color:var(--brand)}
.totop svg{width:18px;height:18px}

.toast{
  position:fixed;left:50%;bottom:34px;transform:translate(-50%,16px);
  background:var(--text);color:var(--bg);font-size:13px;font-weight:600;
  padding:10px 18px;border-radius:12px;opacity:0;pointer-events:none;
  transition:opacity .24s ease,transform .24s ease;
  z-index:200;box-shadow:0 12px 28px rgba(0,0,0,.25);
  max-width:min(90vw,380px);text-align:center;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ===================== 入场动画 ===================== */
.reveal{opacity:0;transform:translateY(18px);transition:opacity .55s ease,transform .55s cubic-bezier(.22,1,.36,1)}
.reveal.in{opacity:1;transform:none}

/* ===================== 响应式 ===================== */
@media (max-width:860px){
  .hero-grid{grid-template-columns:1fr;gap:26px}
  .hero-side{order:-1;justify-content:flex-start}
  .avatar{width:128px;height:128px}
  .avatar-core,.avatar-img{width:92px;height:92px}
  .avatar-core{font-size:32px}
}
@media (max-width:720px){
  :root{--nav-h:58px}
  .nav-links{display:none}
  .brand-sub{display:none}
  .hero{padding-top:calc(var(--nav-h) + 40px)}
  .section{padding:40px 0}
  .hl-grid{grid-template-columns:1fr 1fr}
  .sec-head h2{font-size:18px}
}
@media (max-width:480px){
  .wrap{padding:0 16px}
  .hl-grid{grid-template-columns:1fr}
  .print-btn span{display:none}
  .print-btn{padding:0 12px}
  .points li{font-size:13.5px}
  .lightbox{padding:16px}
}

/* ===================== 减少动效 ===================== */
@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{
    animation-duration:.001ms!important;
    animation-iteration-count:1!important;
    transition-duration:.001ms!important;
  }
  .reveal{opacity:1!important;transform:none!important}
}

/* ===================== 打印 ===================== */
@media print{
  @page{size:A4;margin:12mm 11mm}
  :root, [data-theme="dark"]{
    --bg:#ffffff;--surface:#ffffff;--surface-2:#f2f3f7;
    --text:#111827;--muted:#4b5563;--border:#d9dde5;--border-strong:#c3c8d2;
    --nav-bg:#ffffff;--shadow:none;--shadow-hover:none;

    --brand:#3b3f8f;--brand-2:#3b3f8f;--accent:#4a5568;
    --btn-grad:#3b3f8f;--grad-text:none;
    --glow-1:transparent;--glow-2:transparent;
  }
  html,body{
    background:#fff!important;background-image:none!important;
    font-size:10.5pt;line-height:1.55;
  }
  .nav,.totop,.toast,.skip,.tabs,.lightbox{display:none!important}
  .hero{padding:0 0 14px!important}
  .section{padding:14px 0!important;scroll-margin-top:0}
  .sec-head{margin-bottom:12px}
  .sec-head h2{font-size:15pt}
  .card,.hl,.skill-card,.xp-card,.proj-card,.edu-card,.gallery-item{

}

  /* ===================== 工具函数 ===================== */
  function $(s, r){ return (r || document).querySelector(s); }
  function $$(s, r){ return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[c];
    });
  }
  function fmt(s){
    return esc(s).replace(/【([^】]+)】/g, function(m, p){
      return '<span class="ph">' + p + '</span>';
    });
  }
  function el(tag, cls, html){
    var n = document.createElement(tag);
    if(cls) n.className = cls;

    return n;
  }

  /* ===================== 通用 Tabs 构建 ===================== */
  function buildTabs(opts){
    var tablist = opts.tablist;
    var panelsBox = opts.panels;
    var groups = opts.groups || [];
    var renderItem = opts.renderItem;
    var listClass = opts.listClass || '';

    tablist.innerHTML = '';
    panelsBox.innerHTML = '';

    var btns = [];
    var pans = [];

    groups.forEach(function(g, i){
      var btn = el('button', 'tab');
      btn.type = 'button';
      btn.id = 'tab-' + g.id;
      btn.setAttribute('role', 'tab');
      btn.setAttribute('aria-selected', i === 0 ? 'true' : 'false');
      btn.setAttribute('aria-controls', 'panel-' + g.id);
      btn.tabIndex = i === 0 ? 0 : -1;
      btn.textContent = g.label;
      tablist.appendChild(btn);
      btns.push(btn);

      var panel = el('div', 'tabpanel');
      panel.id = 'panel-' + g.id;
      panel.setAttribute('role', 'tabpanel');
      panel.setAttribute('aria-labelledby', btn.id);
      panel.hidden = (i !== 0);

      var list = el('div', listClass);
      (g.items || []).forEach(function(it){ list.appendChild(renderItem(it)); });
      panel.appendChild(list);
      panelsBox.appendChild(panel);
      pans.push(panel);
    });

    function activate(idx){
      btns.forEach(function(b, i){
        var on = (i === idx);
        b.setAttribute('aria-selected', on ? 'true' : 'false');
        b.tabIndex = on ? 0 : -1;
        pans[i].hidden = !on;
        if(on){
          pans[i].classList.remove('fade-in');
          void pans[i].offsetWidth;
          if(!REDUCE) pans[i].classList.add('fade-in');
          $$('.reveal', pans[i]).forEach(function(n){ n.classList.add('in'); });
        }
      });
    }

    btns.forEach(function(b, i){
      b.addEventListener('click', function(){ activate(i); });
    });

    tablist.addEventListener('keydown', function(e){
      var cur = btns.indexOf(document.activeElement);
      if(cur < 0) return;
      var next = null;
      switch(e.key){
        case 'ArrowRight':
        case 'ArrowDown': next = (cur + 1) % btns.length; break;
        case 'ArrowLeft':
        case 'ArrowUp': next = (cur - 1 + btns.length) % btns.length; break;
        case 'Home': next = 0; break;
        case 'End': next = btns.length - 1; break;
      }
      if(next !== null){
        e.preventDefault();
        activate(next);
        btns[next].focus();
      }
    });

    if(groups.length < 2) tablist.style.display = 'none';
  }

  function initLightbox(){

    function open(src, alt){
      if(!src) return;
      lastFocus = document.activeElement;
      lbImg.src = src;
      lbImg.alt = alt || '';
      lb.classList.add('show');
      lb.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
      var closeBtn = $('.lightbox-close', lb);
      if(closeBtn) closeBtn.focus();
    }

    function close(){
      lb.classList.remove('show');
      lb.setAttribute('aria-hidden', 'true');
      document.body.style.overflow = '';
      if(lastFocus && lastFocus.focus) lastFocus.focus();
      setTimeout(function(){ lbImg.src = ''; }, 240);
    }

    document.addEventListener('click', function(e){
      var t = e.target;
      if(!t || !t.closest) return;
      var item = t.closest('.gallery-item');
      if(item){
        var img = item.querySelector('img');
        if(img && img.naturalWidth > 0) open(img.getAttribute('src'), img.getAttribute('alt'));
      }
    });

    lb.addEventListener('click', function(e){
      if(e.target === lb || (e.target.closest && e.target.closest('.lightbox-close'))) close();
    });

    document.addEventListener('keydown', function(e){
      if(e.key === 'Escape' && lb.classList.contains('show')) close();
    });
  }

    if(REDUCE || !('IntersectionObserver' in window)){
      bars.forEach(function(b){ b.style.width = b.getAttribute('data-w') + '%'; });
      return;

    var io = new IntersectionObserver(function(entries, obs){
      entries.forEach(function(en){
        if(en.isIntersecting){
          var node = en.target;
          setTimeout(function(){ node.style.width = node.getAttribute('data-w') + '%'; }, 80);
          obs.unobserve(node);
        }
      });
    }, { threshold: 0.35 });
    bars.forEach(function(b){ io.observe(b); });

  function initTheme(){
    var btn = $('#themeBtn');
    var mq = null;
    try{ mq = window.matchMedia('(prefers-color-scheme: dark)'); }catch(e){}

    function apply(t){
      document.documentElement.setAttribute('data-theme', t);
      btn.innerHTML = (t === 'dark') ? ICON.sun : ICON.moon;
      var label = (t === 'dark') ? '切换到浅色模式' : '切换到深色模式';
      btn.setAttribute('aria-label', label);
      btn.setAttribute('title', label);
    }

    var cur = document.documentElement.getAttribute('data-theme') || 'light';
    apply(cur);

    btn.addEventListener('click', function(){
      cur = (cur === 'dark') ? 'light' : 'dark';
      try{ localStorage.setItem('resume-theme', cur); }catch(e){}
      apply(cur);
    });

    if(mq){
      var handler = function(ev){
        var saved = null;
        try{ saved = localStorage.getItem('resume-theme'); }catch(e){}
        if(!saved){
          cur = ev.matches ? 'dark' : 'light';
          apply(cur);
        }
      };
      if(mq.addEventListener) mq.addEventListener('change', handler);
      else if(mq.addListener) mq.addListener(handler);
    }
  }

  /* ===================== 复制 & Toast ===================== */
  var toastTimer = null;
  function showToast(msg){
    var t = $('#toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 1900);

  function copyText(text, btn){
    function done(){
      showToast('已复制：' + text);
      if(btn){
        btn.classList.add('copied');
        setTimeout(function(){ btn.classList.remove('copied'); }, 900);
      }
    }
    function fallback(){
      try{
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.cssText = 'position:fixed;top:-1000px;left:-1000px;opacity:0';
        document.body.appendChild(ta);
        ta.select();
        ta.setSelectionRange(0, text.length);
        var ok = document.execCommand('copy');
        document.body.removeChild(ta);
        ok ? done() : showToast('复制失败，请手动复制');
      }catch(e){
        showToast('复制失败，请手动复制');
      }
    }
    if(navigator.clipboard && navigator.clipboard.writeText && window.isSecureContext){
      navigator.clipboard.writeText(text).then(done).catch(fallback);
    }else{
      fallback();
    }
  }

  /* ===================== 入场动画 ===================== */
  function initReveal(){
    var nodes = $$('.reveal');
    if(REDUCE || !('IntersectionObserver' in window)){
      nodes.forEach(function(n){ n.classList.add('in'); });
      return;
    }
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(en){
        if(en.isIntersecting){
          en.target.classList.add('in');
          io.unobserve(en.target);
        }
      });
    }, { rootMargin: '0px 0px -6% 0px', threshold: 0.08 });

    nodes.forEach(function(n){
      var p = n.closest ? n.closest('.tabpanel') : null;
      if(p && p.hidden) return;
      io.observe(n);
    });
  }

    var btn = $('#printBtn');
    btn.addEventListener('click', function(){
      /* 打印前确保所有标签面板内容展开（CSS 中也会兜底） */
      $$('.tabpanel').forEach(function(p){ p.hidden = false; });
      $$('.reveal').forEach(function(n){ n.classList.add('in'); });
      $$('.bar > i').forEach(function(b){ b.style.width = b.getAttribute('data-w') + '%'; });
      setTimeout(function(){ window.print(); }, 80);
    });
    window.addEventListener('afterprint', function(){
      /* 打印结束后恢复首个标签选中状态 */
      $$('.tabs').forEach(function(tl){
        var first = tl.querySelector('.tab');
        if(first) first.click();
      });
    });
  }

  /* ===================== 启动 ===================== */
  function boot(){
    document.getElementById('year').textContent = new Date().getFullYear();

    renderHero();
    initAvatar();
    renderHighlights();
    renderExperience();
    renderProjects();
    renderGallery();
    renderSkills();
    renderEducation();

    initTheme();
    initTop();
    initPrint();
    initLightbox();

    /* 等待 DOM 落地后再做动画观察 */
    requestAnimationFrame(function(){
      initReveal();
      animateBars();
    });
  }

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', boot);
  }else{
    boot();
  }
})();
</script>
</body>
</html>
